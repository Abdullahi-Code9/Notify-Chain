name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd listener
          npm ci

      - name: Verify migration order and apply migrations
        env:
          DATABASE_PATH: ./data/notifications.db
        run: |
          cd listener
          npm run check-migrations   # fails if pending migrations
          npm run migrate            # apply all migrations

      - name: Run listener typecheck and tests
        run: |
          cd listener
          npm run typecheck
          npm test
