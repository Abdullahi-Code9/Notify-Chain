name: Documentation Link Validation

on:
  pull_request:
    paths:
      - "**.md"
      - "docs/**"
      - "scripts/check-doc-links.py"
  push:
    branches: [main]
    paths:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: doc-links-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-links:
    name: check-markdown-links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Documentation Link Validator
        run: |
          python3 scripts/check-doc-links.py --warn-only
